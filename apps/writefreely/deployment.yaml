apiVersion: v1
kind: Namespace
metadata:
  name: writefreely
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: writefreely-data
  namespace: writefreely
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writefreely
  namespace: writefreely
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writefreely
  template:
    metadata:
      labels:
        app: writefreely
    spec:
      serviceAccountName: writefreely
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 5000
      initContainers:
      - name: db-migrate
        image: ghcr.io/writefreely/writefreely:v0.17.1
        imagePullPolicy: IfNotPresent
        args: ["-c", "/data/config.ini", "db", "migrate"]
        securityContext:
          runAsUser: 5000
          runAsGroup: 5000
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: writefreely
        image: ghcr.io/writefreely/writefreely:v0.17.1
        imagePullPolicy: IfNotPresent
        args: ["-c", "/data/config.ini"]
        securityContext:
          runAsUser: 5000
          runAsGroup: 5000
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: writefreely-data
---
apiVersion: v1
kind: Service
metadata:
  name: writefreely
  namespace: writefreely
spec:
  selector:
    app: writefreely
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: writefreely
  namespace: writefreely
spec:
  parentRefs:
  - name: internal-gateway
    namespace: envoy-gateway-system
  hostnames:
  - "kosuke-notebook.internal"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: writefreely
      port: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: writefreely
  namespace: writefreely
automountServiceAccountToken: false  # APIトークン不要
